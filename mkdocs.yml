site_name: VQL Docs
site_url: https://wxn0brp.github.io/VQL
repo_url: https://github.com/wxn0brP/VQL

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo

nav:
  - Home: index.md
  - Guide:
      - Getting Started: guide/getting_started.md
      - Examples: guide/examples.md
      - Troubleshooting: guide/troubleshooting.md
  - Language:
      - Overview: lang/base.md
      - VQLS: lang/VQLS.md
      - VQLR: lang/VQLR.md
  - Core:
      - Configuration: core/configuration.md
      - Relations: core/relations.md
      - Permissions: core/permissions.md
      - Adapters: core/adapters.md
      - Errors: core/errors.md
  - Integration:
      - HTTP API: integration/http.md
      - Browser: integration/browser.md

markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
